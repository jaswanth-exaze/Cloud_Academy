services:

  api:
    build: .
    container_name: support-ticket-api
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: support_ticket_db
      DB_USER: postgres
      DB_PASSWORD: postgres_password_docker
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: support-ticket-postgres
    environment:
      POSTGRES_DB: support_ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: support-ticket-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: